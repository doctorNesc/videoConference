<header class="d-flex">
  <li>
    <a routerLink="/sfu/room1" routerLinkActive="active" ariaCurrentWhenActive="page">First Component</a>
  </li>
  <li>
    <a routerLink="/sfu/room2" routerLinkActive="active" ariaCurrentWhenActive="page">Second Component</a>
  </li>
  <li>
    <a routerLink="/admin" routerLinkActive="active" ariaCurrentWhenActive="page">Admin</a>
  </li>

  <li>
    <a routerLink="/B405" routerLinkActive="active" ariaCurrentWhenActive="page">B405</a>
  </li>
</header>

<main class="main">
  <div class="input-combined">
    <span class="material-symbols-outlined input-icon" style="color: #FFF; "
      (click)="createConf.focus()">video_call</span>
    <button #createConf (click)="createNewConference()" class="create-btn">Create New Conference</button>
  </div>

  <div>
  <div class="input-combined">
    <span class="material-symbols-outlined input-icon" (click)="roomname.focus()">keyboard</span>
    <input type="text" #roomname [(ngModel)]="roomName" placeholder="Enter room name" class="form-control py-2"
      style="width: 300px" />
  </div>

  <div class="input-combined py-3">
    <span class="material-symbols-outlined input-icon" (click)="roomname.focus()">id_card</span>
    <input type="text" #name [(ngModel)]="userName" placeholder="Enter your name" class="form-control py-2"
      style="width: 300px" />
    <label for="#inTheRoom">Device is in the real room</label>
    <input type="checkbox" #isInTheRoom [(ngModel)]="inTheRoom" placeholder="Is in the physical room" class="py-2" />
  </div>
  </div>

  <button (click)="joinConference()" [disabled]="!roomName.length" class="join-btn">
    Join Conference
  </button>
</main>
