<header class="d-flex">
  <!-- Admin link -->
  <div class="admin-link">
    <a href="/admin" class="btn-admin">⚙️ Room Admin</a>
  </div>
</header>

<main class="main">

  <!-- ── Create new conference ──────────────────────────────────────────── -->
  <div class="input-combined">
    <span class="material-symbols-outlined input-icon" style="color: #FFF;"
      (click)="createConf.focus()">video_call</span>
    <button #createConf (click)="createNewConference()" class="create-btn">Create New Conference</button>
  </div>

  <!-- ── Join existing conference ───────────────────────────────────────── -->
  <div>
    <div class="input-combined">
      <span class="material-symbols-outlined input-icon" (click)="roomname.focus()">keyboard</span>
      <input type="text" #roomname [(ngModel)]="roomName" placeholder="Enter room name"
        class="form-control py-2" style="width: 300px" />
    </div>

    <div class="input-combined py-3">
      <span class="material-symbols-outlined input-icon" (click)="name.focus()">id_card</span>
      <input type="text" #name [(ngModel)]="userName" (ngModelChange)="onUserNameChange()"
        placeholder="Enter your name" class="form-control py-2" style="width: 300px" />
    </div>

    <!-- ── Camera pre-selection ──────────────────────────────────────────── -->
    @if (cameraEnumSupported) {
      <div class="input-combined py-2 camera-select-row">
        <span class="material-symbols-outlined input-icon">videocam</span>

        @if (loadingCameras) {
          <span class="camera-loading">Detecting cameras…</span>
        } @else if (cameras.length === 0) {
          <span class="camera-none">No cameras detected</span>
        } @else {
          <select
            [(ngModel)]="selectedCameraId"
            (ngModelChange)="onCameraChange()"
            class="form-control camera-select"
            style="width: 300px"
          >
            <option value="">Default camera</option>
            @for (cam of cameras; track cam.deviceId) {
              <option [value]="cam.deviceId">{{ cam.label || 'Camera ' + $index }}</option>
            }
          </select>
        }
      </div>
    }

    <!-- ── Room-device checkbox ──────────────────────────────────────────── -->
    <div class="input-combined py-2 room-device-row">
      <span class="material-symbols-outlined input-icon">meeting_room</span>
      <div class="room-device-container">
        <label class="room-device-label" for="inTheRoom">
          <input
            type="checkbox"
            id="inTheRoom"
            [(ngModel)]="inTheRoom"
            (ngModelChange)="onRoomDeviceChange()"
            class="room-device-checkbox"
          />
          Device is in the physical room
        </label>
        <span class="room-device-hint">
          (screens &amp; cameras will be advertised to the server)
        </span>
      </div>
    </div>
  </div>

  <button (click)="joinConference()" [disabled]="!roomName.length" class="join-btn">
    Join Conference
  </button>

</main>
