<div class="meet-toolbar">

  <!-- Left: room name + clock -->
  <div class="toolbar-left">
    <span class="toolbar-room">{{ roomName }}</span>
  </div>

  <!-- Centre: media controls -->
  <div class="toolbar-center">

    <button class="ctrl-btn" [class.ctrl-off]="!audioEnabled" (click)="toggleAudio()"
            [title]="audioEnabled ? 'Mute microphone' : 'Unmute microphone'">
      <span class="material-symbols-rounded">{{ audioEnabled ? 'mic' : 'mic_off' }}</span>
    </button>

    <button class="ctrl-btn" [class.ctrl-off]="!videoEnabled" (click)="toggleVideo()"
            [title]="videoEnabled ? 'Turn off camera' : 'Turn on camera'">
      <span class="material-symbols-rounded">{{ videoEnabled ? 'videocam' : 'videocam_off' }}</span>
    </button>

    <button class="ctrl-btn" *ngIf="!isSharingScreen()" (click)="startScreenShareBtn()"
            title="Present now">
      <span class="material-symbols-rounded">present_to_all</span>
    </button>

    <button class="ctrl-btn ctrl-active" *ngIf="isSharingScreen()" (click)="stopScreenShareBtn()"
            title="Stop presenting">
      <span class="material-symbols-rounded">pause_presentation</span>
    </button>

    <button class="ctrl-btn ctrl-leave" (click)="leaveCall.emit()" title="Leave call">
      <span class="material-symbols-rounded">call_end</span>
    </button>

  </div>

  <!-- Right: people / chat -->
  <div class="toolbar-right">
    <button class="ctrl-btn ctrl-ghost" (click)="showUsersPanel.emit(true)" title="Chat">
      <span class="material-symbols-rounded">chat</span>
    </button>
  </div>

</div>
